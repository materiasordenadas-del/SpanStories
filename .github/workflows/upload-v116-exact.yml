name: Upload v1.16 exact CSV
on:
  push:
    branches: [prueba]
    paths:
      - '.github/workflows/upload-v116-exact.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify exact CSV
        shell: bash
        run: |
          set -euo pipefail
          target='docs/curriculum/a1/audits/spanishstories_a1_phase7c_regional_variation_v1.16.csv'
          mkdir -p "$(dirname "$target")"
          cat .tmp-v116/chunk01.b64 .tmp-v116/chunk02.b64 .tmp-v116/chunk03.b64 .tmp-v116/chunk04.b64 .tmp-v116/chunk05.b64 .tmp-v116/chunk06.b64 .tmp-v116/chunk07.b64 | base64 -d > "$target"
          actual="$(git hash-object "$target")"
          expected='90504b83bc77105e3dcc5aa681275d9417f4cff8'
          test "$actual" = "$expected"
          rm -rf .tmp-v116
          rm -f .github/workflows/upload-v116-exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add exact A1 phase 7C regional variation CSV v1.16'
          git push
