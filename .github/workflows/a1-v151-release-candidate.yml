name: A1 v1.51 release candidate verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and validate candidate
        run: python docs/curriculum/a1-restructure/tools/generate_v151_release_candidate.py "$RUNNER_TEMP/a1-v151-rc1"
      - name: Show generated counts
        run: cat "$RUNNER_TEMP/a1-v151-rc1/generation-summary-v1.51-rc1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: a1-v151-release-candidate-verification
          path: ${{ runner.temp }}/a1-v151-rc1/
          if-no-files-found: error
