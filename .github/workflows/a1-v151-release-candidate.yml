name: A1 v1.51 release candidate

on:
  push:
    branches: [prueba]
    paths:
      - '.github/workflows/a1-v151-release-candidate.yml'
      - 'docs/curriculum/a1-restructure/tools/generate_v151_release_candidate.py'
      - 'docs/curriculum/a1-restructure/spanstories_a1_target_allocation_rules_etapa_e_v1.0.csv'
      - 'docs/curriculum/a1-restructure/etapa-f-recycling-route-matrix-v1.0.csv'
      - 'docs/curriculum/a1-restructure/etapa-g-dele-remap-13-of-13-v1.0.csv'
      - 'docs/curriculum/a1-restructure/etapa-g-dele-story-support-contract-v1.0.csv'
      - 'content/a1/vocabulary/spanishstories_a1_ws_sequencing_allocation_v1.44.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate candidate
        run: python docs/curriculum/a1-restructure/tools/generate_v151_release_candidate.py "$RUNNER_TEMP/a1-v151-rc1"
      - name: Show generated counts
        run: cat "$RUNNER_TEMP/a1-v151-rc1/generation-summary-v1.51-rc1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: a1-v151-release-candidate-rc1
          path: ${{ runner.temp }}/a1-v151-rc1/
          if-no-files-found: error
