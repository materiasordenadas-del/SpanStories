name: Upload A1 audit CSV
on:
  push:
    branches: [prueba]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode audit CSV
        shell: bash
        run: |
          mkdir -p docs/curriculum/a1/audits
          cat <<'PAYLOAD' | base64 -d | gzip -d > docs/curriculum/a1/audits/spanishstories_a1_phase7b_economy_government_religion_geography_v1.15.csv
          
          PAYLOAD
      - name: Commit audit CSV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/curriculum/a1/audits/spanishstories_a1_phase7b_economy_government_religion_geography_v1.15.csv
          git rm .github/workflows/upload-a1-audit.yml
          git commit -m "Add A1 phase 7B-VII audit CSV"
          git push origin HEAD:prueba
