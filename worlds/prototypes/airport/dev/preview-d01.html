<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Preview de zona · SpanStories</title>
<style>html,body{margin:0;height:100%;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
<body>
<script type="module">
import * as T from '../engine/three.js';
import { createAirportChunk } from '../engine/AirportChunk.js';
import { DEPARTURE_ROUTE } from '../engine/routes.js';

const params = new URLSearchParams(location.search);
const zone = params.get('zone') || 'D01';
const shot = params.get('shot') || '1';

const renderer = new T.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.NoToneMapping;
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);

const scene = new T.Scene();
scene.background = new T.Color(0xc7dce0);
scene.add(new T.AmbientLight(0xffffff, .58));
const sun = new T.DirectionalLight(0xfff1d2, 1.05);
sun.position.set(-3, 5, 4); scene.add(sun);

const camera = new T.PerspectiveCamera(52, innerWidth / innerHeight, .08, 80);
// Shared scene light (Luz25D): ambience from ?amb=, covered rooms of the route, outline size.
const { luz } = await import('../engine/Luz25D.js');
luz.usarAmbiente(params.get('amb') || 'manana');
luz.salas(DEPARTURE_ROUTE.map(({ center: [x, z], width, depth }) => [x - width / 2, z - depth / 2, x + width / 2, z + depth / 2]));
luz.viewport(innerWidth, innerHeight, 1);
// Minimal registry stub: the preview owns nothing and lives for one page load.
const registry = { acquire(key, load) { const value = load(new AbortController().signal); return { ready: Promise.resolve(value), release() {} }; } };

const meta = DEPARTURE_ROUTE.find(z => z.id === zone);
const chunk = await createAirportChunk(meta, { scene, renderer, camera, registry, signal: new AbortController().signal });
await chunk.prepareHigh(new AbortController().signal);
chunk.setActive(true);

// Architectural audit only: the reference has no foreground palms. Hide
// these movable props in this preview without changing the live scene or saves.
if (params.has('facade')) chunk.root.traverse(node => {
  if (/^(palmera|base de la palmera)/.test(node.userData.movable?.label || '')) {
    node.visible = false;
    for (const follower of node.userData.movable?.followers || []) follower.visible = false;
  }
});

const VIEWPOINTS = {
  D01: {
    '1': [[-8.6, 1.62, 1.4], [-12, 1.15, -4.8]],       // ATM row from the entrance
    '2': [[8.5, 4.4, 7.2], [-3, 0, -1.5]],             // high oblique: floor design
    '3': [[0, 1.62, 7], [-1, 1.0, -5]],                // queue lanes toward counters
  },
  D00: {
    '1': [[0, 1.62, 16.5], [0, 3.1, 5]],               // street view of the facade (reference shot)
    '2': [[0, 1.62, -1.5], [0, 2.2, 5]],               // from inside looking out the doors
    '3': [[5.6, 1.62, 11.5], [2.8, 1.3, 8.2]],         // directory totem + palm
    '4': [[-1.2, 1.62, 9.8], [-4.2, 1.4, 8.6]],        // promo totem
    '5': [[0, 26, 12.5], [0, 0, 5]],                   // bird's eye of the forecourt
    '6': [[-3, 1.62, 16.5], [-10.5, 2.6, 5]],          // left portico + treeline behind it
    '7': [[-10, 30, 4], [-12, 0, -4]],                 // bird's eye of the portico and lawn
    '8': [[1, 1.62, 25], [1, 4.2, 5]],                 // wide street view: full facade up to the canopy
    '9': [[-2, 1.62, -3], [0, 6.2, 5]],                // inside, looking up at the clerestory
  },
};
// ?cam=x,y,z,lx,ly,lz overrides the shot (zone-local metres).
const cam = params.get('cam')?.split(',').map(Number);
if (cam?.length === 6) VIEWPOINTS[zone] = { ...VIEWPOINTS[zone], [shot]: [cam.slice(0, 3), cam.slice(3)] };
if (zone === 'D01' && shot === '4') {          // top-down floor check: components only, no shell
  const { createKit } = await import('../engine/ThreeResources.js');
  const { buildAirportComponents } = await import('../engine/AirportComponents.js');
  const kit = createKit();
  const stubScope = { own: r => r, defer() {}, lease: l => l.ready, listen() {}, mixer() {}, dispose() {}, closed: false };
  const group = new T.Group(); scene.add(group);
  buildAirportComponents(meta, { scope: stubScope, kit, group, interactive: [], colliders: [], worldPosition: new T.Vector3() });
  scene.remove(chunk.root);
  camera.up.set(0, 0, -1);
  camera.position.set(0, 18, 0);
  camera.lookAt(0, 0, 0);
} else {
  const [pos, look] = VIEWPOINTS[zone]?.[shot] || [[0, 1.62, 0], [0, 1.4, -5]];
  const [cx, cz] = meta.center;
  camera.position.set(pos[0] + cx, pos[1], pos[2] + cz);
  camera.lookAt(look[0] + cx, look[1], look[2] + cz);
}
camera.updateProjectionMatrix();
renderer.render(scene, camera);   // first frame synchronously, so even an early screenshot shows the scene

let frames = 0;
function runProbe() {
  const probe = params.get('probe');
  if (!probe || document.getElementById('probe-out')) return;
  try {
    const center = new T.Vector3(meta.center[0], 0, meta.center[1]);
    const lines = [];
    chunk.root.traverse(o => {
      if (!o.isMesh && !o.isInstancedMesh) return;
      if (o.isInstancedMesh) {
        const m = new T.Matrix4(), p = new T.Vector3(), q = new T.Quaternion(), s = new T.Vector3();
        for (let i = 0; i < o.count; i++) {
          o.getMatrixAt(i, m); m.decompose(p, q, s);
          if (Math.max(Math.abs(s.x), Math.abs(s.y), Math.abs(s.z)) < 4) continue;
          const mat = [].concat(o.material || [])[0];
          lines.push(`INST ${mat?.color?.getHexString?.() || 'tex'} i=${i}/${o.count} center=${p.clone().add(center).toArray().map(v => +v.toFixed(1))} size=${s.toArray().map(v => +v.toFixed(1))}`);
        }
      } else {
        o.geometry.computeBoundingBox();
        const size = o.geometry.boundingBox.getSize(new T.Vector3());
        if (Math.max(size.x * Math.abs(o.scale.x), size.y * Math.abs(o.scale.y), size.z * Math.abs(o.scale.z)) < 4) return;
        const mat = [].concat(o.material || [])[0];
        lines.push(`MESH ${mat?.color?.getHexString?.() || (mat?.map ? 'tex' : '?')} map=${mat?.map ? 'y' : 'n'} pos=${o.position.clone().add(center).toArray().map(v => +v.toFixed(1))} scale=${o.scale.toArray().map(v => +v.toFixed(2))} geoSize=${size.toArray().map(v => +v.toFixed(1))}`);
      }
    });
    const div = document.createElement('pre');
    div.id = 'probe-out';
    div.style.cssText = 'position:fixed;top:8px;left:8px;background:#000c;color:#0f0;font:14px monospace;padding:8px;z-index:9;white-space:pre-wrap;max-width:95vw';
    div.textContent = lines.join('\n') || 'no large meshes';
    document.body.append(div);
  } catch (error) {
    const div = document.createElement('pre');
    div.id = 'probe-out';
    div.style.cssText = 'position:fixed;top:8px;left:8px;background:#000c;color:#f66;font:14px monospace;padding:8px;z-index:9';
    div.textContent = 'PROBE ERROR: ' + (error.stack || error.message);
    document.body.append(div);
  }
}
(function loop() {
  chunk.update(1 / 60, camera, { lodScale: 1 });
  renderer.render(scene, camera);
  runProbe();
  if (++frames < 8) requestAnimationFrame(loop);
  else { document.title = 'ready'; setTimeout(runProbe, 300); }
})();
</script>
</body>
</html>
